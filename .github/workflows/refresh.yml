name: Refresh public campaign totals

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '*.mjs'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

concurrency:
  group: campaign-progress
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check GoFundMe
        run: node refresh-campaign.mjs
        env:
          CAMPAIGN_OUTPUT: campaign-progress.json
          CAMPAIGN_REFRESH_REQUIRED: '1'
      - name: Publish verified totals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campaign-progress.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GoFundMe campaign totals'
            git push
          fi
